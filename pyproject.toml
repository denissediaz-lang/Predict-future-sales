[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "future_sales"
version = "0.0.1"
description = "Predicci\u00f3n de ventas futuras - Product Development, Maestr\u00eda BI y Analytics (Galileo)"
authors = [
  { name = "Gabriela Diaz" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["future_sales"]
include = ["pyproject.toml", "future_sales/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["future_sales"]
force-sort-within-sections = true

